<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<meta name="theme-color" content="#0f1117">
<title>СТО — Склад</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/quagga@0.12.1/dist/quagga.min.js"></script>
<style>
  :root {
    --bg: #0f1117;
    --surface: #181c25;
    --surface2: #1f2433;
    --border: #2a3044;
    --accent: #f0a500;
    --accent2: #e05c2a;
    --text: #e8ecf5;
    --text2: #8a94aa;
    --radius: 12px;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font-family: 'IBM Plex Sans', sans-serif; }
  .warehouse-root { padding: 18px 16px 40px; max-width: 480px; margin: 0 auto; }
  .sub-tabs { display: flex; background: var(--surface2); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 18px; }
  .sub-tab { flex: 1; padding: 12px 0; text-align: center; font-size: 13px; font-weight: 600; color: var(--text2); cursor: pointer; }
  .sub-tab.active { color: var(--accent); background: rgba(240,165,0,0.08); }
  .form-group { margin-bottom: 14px; }
  .form-label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text2); margin-bottom: 6px; }
  .form-control { width: 100%; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 13px 14px; color: var(--text); font-size: 14px; outline: none; }
  .form-control:focus { border-color: var(--accent); }
  .form-control[readonly] { background: #131823; }
  .scanner-container { width: 100%; min-height: 280px; background: var(--surface2); border: 1px solid var(--border); border-radius: 12px; margin-bottom: 16px; display: none; }
  .scanner-container.active { display: block; }
  .btn-row { display: flex; gap: 10px; margin-top: 16px; }
  .btn { flex: 1; border: none; border-radius: 12px; padding: 14px 16px; font-weight: 700; cursor: pointer; }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-secondary { background: var(--surface2); color: var(--text); border: 1px solid var(--border); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
</style>
</head>
<body>
<div class="warehouse-root">
  <div class="sub-tabs" id="warehouse-sub-tabs"></div>

  <div class="form-group">
    <label class="form-label">Штрихкод</label>
    <input class="form-control" id="warehouse-f-barcode" placeholder="Сканируйте или введите" readonly>
    <button class="btn btn-secondary" type="button" id="warehouse-scan-button" onclick="warehouseToggleScan(this)" style="margin-top:12px;">📷 Сканировать</button>
  </div>
  <div class="scanner-container" id="warehouse-scanner-container"></div>

  <div class="form-group">
    <label class="form-label">Название</label>
    <input class="form-control" id="warehouse-f-name" placeholder="Название материала">
  </div>
  <div class="form-group">
    <label class="form-label">Ед. изм.</label>
    <select class="form-control" id="warehouse-f-unit">
      <option value="">— Выберите —</option>
    </select>
  </div>
  <div class="form-group">
    <label class="form-label">Комментарий</label>
    <input class="form-control" id="warehouse-f-comment" placeholder="Комментарий">
  </div>
  <div class="form-group">
    <label class="form-label">Количество</label>
    <input class="form-control" id="warehouse-f-qty" type="number" min="0" step="0.01" placeholder="0.00">
  </div>

  <div class="btn-row">
    <button class="btn btn-secondary" type="button" onclick="warehouseResetForm()">Сбросить</button>
    <button class="btn btn-primary" type="button" id="warehouse-btn-save" onclick="warehouseSaveRecord()">Сохранить</button>
  </div>
</div>

<script>
  let warehouseNomenclature = [];
  let warehouseMode = 'oprihodovat';

  window.warehouseModuleInit = async function() {
    await warehouseLoadNomenclature();
    warehouseInit();
  };

  async function warehouseLoadNomenclature() {
    showOverlay('Загрузка номенклатуры...');
    try {
      const res = await apiGet({ action: 'getNomenclature' });
      if (res.success) {
        warehouseNomenclature = res.nomenclature || [];
      } else {
        const cached = localStorage.getItem('sto_nomenclature_cache');
        if (cached) warehouseNomenclature = JSON.parse(cached);
      }
      localStorage.setItem('sto_nomenclature_cache', JSON.stringify(warehouseNomenclature));
    } catch (err) {
      const cached = localStorage.getItem('sto_nomenclature_cache');
      if (cached) warehouseNomenclature = JSON.parse(cached);
      else showToast('Не удалось загрузить номенклатуру', true);
    }
    hideOverlay();
  }

  function warehouseInit() {
    const units = [...new Set(warehouseNomenclature.map(n => n.unit).filter(Boolean))];
    const unitSelect = document.getElementById('warehouse-f-unit');
    unitSelect.innerHTML = '<option value="">— Выберите —</option>';
    units.forEach(unit => {
      const opt = document.createElement('option');
      opt.value = unit;
      opt.textContent = unit;
      unitSelect.appendChild(opt);
    });
    const tabs = document.getElementById('warehouse-sub-tabs');
    tabs.innerHTML = '';
    if (currentUser?.role === 'Кладовщик') {
      tabs.innerHTML = `
        <button class="sub-tab active" id="warehouse-sub-oprihodovat" type="button" onclick="warehouseSetMode('oprihodovat')">Оприходовать</button>
        <button class="sub-tab" id="warehouse-sub-vydat" type="button" onclick="warehouseSetMode('vydat')">Выдать</button>
      `;
      warehouseMode = 'oprihodovat';
    } else {
      tabs.innerHTML = `
        <button class="sub-tab active" id="warehouse-sub-vzyat" type="button" onclick="warehouseSetMode('vzyat')">Взять со склада</button>
      `;
      warehouseMode = 'vzyat';
    }
    warehouseResetForm();
  }

  function warehouseSetMode(mode) {
    warehouseMode = mode;
    document.querySelectorAll('#warehouse-sub-tabs .sub-tab').forEach(tab => {
      tab.classList.toggle('active', tab.id === 'warehouse-sub-' + mode);
    });
    warehouseResetForm();
  }

  let warehouseScanActive = false;

  function warehouseToggleScan(button) {
    if (warehouseScanActive) {
      warehouseStopScan();
      updateWarehouseScanButton();
      return;
    }
    warehouseStartScan();
    updateWarehouseScanButton();
  }

  function updateWarehouseScanButton() {
    const button = document.getElementById('warehouse-scan-button');
    if (!button) return;
    button.innerHTML = warehouseScanActive ? '📷 Закрыть камеру' : '📷 Сканировать';
  }

  function warehouseStartScan() {
    const container = document.getElementById('warehouse-scanner-container');
    container.classList.add('active');
    warehouseScanActive = true;
    updateWarehouseScanButton();
    try { Quagga.stop(); } catch (ignore) {}
    Quagga.init({
      inputStream: { name: 'Live', type: 'LiveStream', target: container, constraints: { facingMode: 'environment' } },
      locator: { patchSize: 'medium', halfSample: true },
      numOfWorkers: navigator.hardwareConcurrency ? Math.min(4, navigator.hardwareConcurrency) : 2,
      decoder: { readers: ['ean_reader','ean_8_reader','code_128_reader','code_39_reader','upc_reader','upc_e_reader','qr_reader'] },
      locate: true
    }, function(err) {
      if (err) {
        warehouseScanActive = false;
        container.classList.remove('active');
        updateWarehouseScanButton();
        showToast('Камера недоступна', true);
        return;
      }
      Quagga.start();
    });
    try { if (Quagga.offDetected) Quagga.offDetected(warehouseOnDetected); } catch(e){}
    Quagga.onDetected(warehouseOnDetected);
    // Добавляем обработчик onProcessed для отладки: рисует найденные боксы и линии
    try {
      Quagga.onProcessed(function(result) {
        if (!result) return;
        try {
          const drawingCtx = Quagga.canvas && Quagga.canvas.ctx && Quagga.canvas.ctx.overlay;
          const drawingCanvas = Quagga.canvas && Quagga.canvas.dom && Quagga.canvas.dom.overlay;
          if (drawingCtx && drawingCanvas) {
            drawingCtx.clearRect(0, 0, drawingCanvas.width, drawingCanvas.height);
            if (result.boxes) {
              result.boxes.filter(b => b !== result.box).forEach(function(box) {
                Quagga.ImageDebug.drawPath(box, {x: 0, y: 1}, drawingCtx, {color: 'green', lineWidth: 2});
              });
            }
            if (result.box) {
              Quagga.ImageDebug.drawPath(result.box, {x: 0, y: 1}, drawingCtx, {color: 'blue', lineWidth: 2});
            }
            if (result.codeResult && result.codeResult.code) {
              // option: draw best line
              if (result.line) Quagga.ImageDebug.drawPath(result.line, {x: 'x', y: 'y'}, drawingCtx, {color: 'red', lineWidth: 3});
            }
          }
        } catch(drawErr){ console.log('Quagga draw error', drawErr); }
      });
    } catch(procErr) { console.log('Quagga onProcessed error', procErr); }
  }

  function warehouseOnDetected(result) {
    console.log('Quagga onDetected:', result);
    const code = result && result.codeResult && result.codeResult.code;
    if (!code) {
      console.log('No code found in result');
      return;
    }
    console.log('Barcode detected:', code);
    warehouseStopScan();
    document.getElementById('warehouse-f-barcode').value = code;
    warehouseOnBarcodeDetected(code);
  }

  function warehouseStopScan() {
    warehouseScanActive = false;
    const container = document.getElementById('warehouse-scanner-container');
    container.classList.remove('active');
    try { Quagga.stop(); } catch (ignore) {}
    updateWarehouseScanButton();
  }

  function warehouseOnBarcodeDetected(barcode) {
    const found = warehouseNomenclature.find(item => item.barcode === barcode);
    const nameField = document.getElementById('warehouse-f-name');
    const unitField = document.getElementById('warehouse-f-unit');
    const commentField = document.getElementById('warehouse-f-comment');
    if (found) {
      nameField.value = found.name;
      nameField.readOnly = true;
      unitField.value = found.unit || '';
      unitField.disabled = Boolean(found.unit);
      commentField.value = found.comment || '';
      commentField.readOnly = true;
    } else {
      nameField.value = '';
      nameField.readOnly = false;
      unitField.value = '';
      unitField.disabled = false;
      commentField.value = '';
      commentField.readOnly = false;
    }
  }

  async function warehouseSaveRecord() {
    const barcode = document.getElementById('warehouse-f-barcode').value.trim();
    const name = document.getElementById('warehouse-f-name').value.trim();
    const unit = document.getElementById('warehouse-f-unit').value.trim();
    const comment = document.getElementById('warehouse-f-comment').value.trim();
    const qtyValue = document.getElementById('warehouse-f-qty').value.trim();
    const qty = parseFloat(qtyValue);
    if (!barcode) { showToast('Введите штрихкод', true); return; }
    if (!name) { showToast('Укажите название', true); return; }
    if (!unit) { showToast('Выберите ед. изм.', true); return; }
    if (!qtyValue || isNaN(qty) || qty <= 0) { showToast('Укажите количество', true); return; }
    const now = new Date();
    const date = now.toLocaleString('ru-RU', { day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit' });
    const status = warehouseMode === 'oprihodovat' ? 'Оприходован' : warehouseMode === 'vydat' ? 'Выдан' : 'Взял';
    const record = {
      ID: 'W' + now.getFullYear() + String(now.getMonth()+1).padStart(2,'0') + String(now.getDate()).padStart(2,'0') + '-' + Math.random().toString(36).substr(2,5).toUpperCase(),
      Дата: date,
      Штрихкод: barcode,
      Название: name,
      'Ед. изм.': unit,
      Комментарий: comment,
      Ответственный: currentUser?.name || '',
      Статус: status,
      Количество: qty
    };
    const isNew = !warehouseNomenclature.some(item => item.barcode === barcode);
    if (isNew && warehouseMode === 'oprihodovat') {
      await apiPost({ action: 'saveNomenclature', record: {
        Штрихкод: barcode,
        Название: name,
        Ед_изм: unit,
        Комментарий: comment,
        Регистратор: currentUser?.name || '',
        Дата: date
      }});
    }
    const btn = document.getElementById('warehouse-btn-save');
    btn.disabled = true;
    btn.textContent = 'Сохранение...';
    try {
      const res = await apiPost({ action: 'saveWarehouse', record });
      if (res.success) {
        showToast('Запись сохранена');
        warehouseResetForm();
      } else {
        showToast('Ошибка: ' + (res.error || ''), true);
      }
    } catch (err) {
      showToast('Ошибка сети', true);
    } finally {
      btn.disabled = false;
      btn.textContent = 'Сохранить';
    }
  }

  function warehouseResetForm() {
    warehouseStopScan();
    document.getElementById('warehouse-f-barcode').value = '';
    document.getElementById('warehouse-f-name').value = '';
    document.getElementById('warehouse-f-name').readOnly = false;
    document.getElementById('warehouse-f-unit').value = '';
    document.getElementById('warehouse-f-unit').disabled = false;
    document.getElementById('warehouse-f-comment').value = '';
    document.getElementById('warehouse-f-comment').readOnly = false;
    document.getElementById('warehouse-f-qty').value = '';
  }
</script>
</body>
</html>
